
substitutions:
  devicename: "esp32-supermini-ld2410c"
  friendly_name: "esp32-supermini-ld2410c"

#packages:
#  core: !include common/supermini/core.yaml


esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino


# wifi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: ${devicename}-ap
    password: !secret fallback-ap-password


# enable the home assistant api
api:
  encryption:
    key: !secret ha-api-key


# enable over the air updates with encryption
ota:
  platform: esphome
  encryption:


#enable the web server
web_server:
  port: 80

logger:
  baud_rate: 0 # Set to 0 if sharing UART or experiencing memory issues

uart:
  - id: uart_link
    tx_pin: 20
    rx_pin: 21
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  uart_id: uart_link

binary_sensor:
  - platform: ld2410
    has_target:
      name: "LD2410C Presence"
    has_moving_target:
      name: "LD2410C Moving Target"
    has_still_target:
      name: "LD2410C Still Target"
    out_pin_presence_status:
      name: "LD2410C Out Pin Status"

sensor:
  - platform: ld2410
    moving_distance:
      name: "LD2410C Moving Target Distance"
    still_distance:
      name: "LD2410C Still Target Distance"
    moving_energy:
      name: "LD2410C Moving Target Energy"
    still_energy:
      name: "LD2410C Still Target Energy"
    detection_distance:
      name: "LD2410C Detection Distance"

button:
  - platform: ld2410
    factory_reset:
      name: "LD2410C Factory Reset"
    restart:
      name: "LD2410C Restart"
    query_params:
      name: "LD2410C Query Parameters"

