
substitutions:
  devicename: "esp32-supermini-ld2410c"
  friendly_name: "esp32-supermini-ld2410c"

#packages:
#  core: !include common/supermini/core.yaml


esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino


# wifi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: ${devicename}-ap
    password: !secret fallback-ap-password


captive_portal:


# enable logging
logger:


# enable the home assistant api
api:
  encryption:
    key: !secret ha-api-key


# enable over the air updates with encryption
ota:
  platform: esphome
  encryption:


#enable the web server
web_server:
  port: 80

  
uart:
  id: uart_b
  rx_pin: 20
  tx_pin: 21
  baud_rate: 256000
  stop_bits: 1
  parity: NONE

  
ld2410:
  uart_id: uart_b

  
binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence Detected"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

      
sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"
