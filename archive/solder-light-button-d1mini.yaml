esphome:
  name: solder-light-button
  friendly_name: Solder Light Button

esp8266:
  board: d1_mini

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: D5
      mode:
        input: true
        pullup: true
  - platform: gpio
    pin:
      number: D6
    name: "Motion"

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "+3cvbOq4eELJ4+lEAKOLkTRleiXwnnLl0QyyiieIQaw="

ota:
  - platform: esphome
    password: "7426bd7f4af3d9514d022b360e21112e"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Solder-Light-Button"
    password: ""

