
esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# wifi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: ${devicename}-ap
    password: !secret fallback-ap-password

captive_portal:

# enable logging
logger:

# enable the home assistant api
api:
  encryption:
    key: !secret ha-api-key

# enable over the air updates with encryption
ota:
  platform: esphome
  encryption:

#enable the web server
web_server:
  port: 80
