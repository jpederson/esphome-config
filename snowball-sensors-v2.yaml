esphome:
  name: snowball-sensors-v2
  friendly_name: Snowball Sensors v2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: snowball-sensors-ap
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 100ms  # default 320ms - how long to spend on each advert channel
    window:   30ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/ssieb/custom_components #Thanks for @ssieb components.
    components: [ serial ]
  
i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a
  frequency: 100kHz
  sda_pullup_enabled: true
  scl_pullup_enabled: true
  
sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      id: 'snowball_temp_cold'
      name: "Temperature (Cold)"
      unit_of_measurement: "°F"
      accuracy_decimals: 1
      filters:
        - lambda: return x * (9.0 / 5.0) + 32.0;
    humidity:
      id: 'snowball_humidity_cold'
      name: "Humidity (Cold)"
      accuracy_decimals: 1
    address: 0x38
    update_interval: 10s

  - platform: bme680
    temperature:
      id: 'snowball_temp_hot'
      name: "Temperature (Hot)"
      oversampling: 16x
      accuracy_decimals: 1
      unit_of_measurement: "°F"
      filters:
        - lambda: return x * (9.0 / 5.0) + 32;
    pressure:
      name: "Pressure"
    humidity:
      id: 'snowball_humidity_hot'
      name: "Humidity (Hot)"
    gas_resistance:
      id: "gas_resistance"
      name: "Gas Resistance"
    address: 0x77
    update_interval: 10s

  - platform: template
    name: "Indoor Air Quality"
    id: iaq
    icon: "mdi:gauge"
    update_interval: 30s
    lambda: |-
      return log(id(gas_resistance).state) + 0.04 *  id(snowball_humidity_hot).state;

text_sensor:
  - platform: template
    name: "IAQ Classification"
    icon: "mdi:checkbox-marked-circle-outline"
    update_interval: 30s
    lambda: |-
      if (int(id(iaq).state) <= 50) {
        return {"Excellent"};
      }
      else if (int(id(iaq).state) <= 100) {
        return {"Good"};
      }
      else if (int(id(iaq).state) <= 150) {
        return {"Lightly polluted"};
      }
      else if (int(id(iaq).state) <= 200) {
        return {"Moderately polluted"};
      }
      else if (int(id(iaq).state) <= 250) {
        return {"Heavily polluted"};
      }
      else if (int(id(iaq).state) <= 350) {
        return {"Severely polluted"};
      }
      else if (int(id(iaq).state) <= 500) {
        return {"Extremely polluted"};
      }
      else {
        return {"unknown"};
      }
