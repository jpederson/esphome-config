esphome:
  name: esp32-supermini-dallas
  friendly_name: esp32-supermini-dallas

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: snowball-sensors-ap
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 100ms  # default 320ms - how long to spend on each advert channel
    window:   30ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

web_server:
  port: 80

# 1-Wire bus setup
one_wire:
  - platform: gpio
    pin: GPIO8

# Sensor configuration
sensor:
  - platform: dallas_temp
    name: "Temperature (Cold)"
    update_interval: 5s
    icon: "mdi:thermometer"
    unit_of_measurement: °C
    device_class: temperature
    address: 0xf1000000cb614528
  - platform: dallas_temp
    name: "Temperature (Hot)"
    update_interval: 5s
    icon: "mdi:thermometer"
    unit_of_measurement: °C
    device_class: temperature
    address: 0x94000000caa59b28
    filters:
      - offset: 9.9


