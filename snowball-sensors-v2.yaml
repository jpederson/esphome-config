esphome:
  name: snowball-sensors-v2
  friendly_name: Snowball Sensors v2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: snowball-sensors-ap
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 100ms  # default 320ms - how long to spend on each advert channel
    window:   30ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/ssieb/custom_components #Thanks for @ssieb components.
    components: [ serial ]
  
i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a
  frequency: 100kHz
  sda_pullup_enabled: true
  scl_pullup_enabled: true
  
sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      id: temperature_cold
      name: Temperature (Cold)
      unit_of_measurement: °C
      accuracy_decimals: 1
      icon: "mdi:thermometer"
    humidity:
      id: 'humidity_cold'
      name: "Humidity (Cold)"
      accuracy_decimals: 1
    address: 0x38
    update_interval: 15s
  - platform: bmp280_i2c
    id: sensor_bmp280_i2c_1
    pressure:
      name: Pressure
      id: sensor_bmp280_i2c_1_pressure
    temperature:
      name: Temperature
      id: sensor_bmp280_i2c_1_temperature


