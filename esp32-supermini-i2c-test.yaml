
substitutions:
  devicename: "esp32-supermini-i2c-test"
  friendly_name: "esp32-supermini-i2c-test"
  update_time: 10s
  bme_temperature_offset: -2
  
packages:
  core: !include common/supermini/core.yaml
  i2c: !include common/supermini/i2c.yaml

sensor:
  - platform: sgp4x
    voc_index:
      name: "VOC Index"
    nox_index:
      name: "NOx Index"
    store_baseline: true

    
  - platform: scd4x
    co2:
      name: "Workshop CO2"
    temperature:
      name: "Workshop Temperature"
    humidity:
      name: "Workshop Humidity"