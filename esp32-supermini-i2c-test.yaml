
substitutions:
  devicename: "esp32-supermini-i2c-test"
  friendly_name: "esp32-supermini-i2c-test"
  update_time: 10s
  bme_temperature_offset: -2
  
packages:
  core: !include common/supermini/core.yaml
  i2c: !include common/supermini/i2c.yaml

sensor:
  - platform: sgp4x
    voc_index:
      name: "VOC Index"
    nox_index:
      name: "NOx Index"
    compensation:
      humidity_source: humidity
      temperature_source: temperature
    store_baseline: true
    update_interval: ${update_time}
    
  - platform: scd4x
    co2:
      id: co2
      name: "CO2"
    temperature:
      id: "temperature"
      name: "Temperature"
    humidity:
      id: "humidity"
      name: "Humidity"
    update_interval: ${update_time}