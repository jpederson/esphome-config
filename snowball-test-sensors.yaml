esphome:
  name: snowball-sensors
  friendly_name: "Snowball Sensors"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: snowball-v2-ap
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key
    
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  sda_pullup_enabled: true
  scl_pullup_enabled: true
  
sensor:
  - platform: aht10
    variant: AHT10
    temperature:
      id: 'temperature_cold'
      name: "Temperature (Cold)"
      unit_of_measurement: "°F"
      accuracy_decimals: 1
      filters:
        - lambda: return x * (9.0 / 5.0) + 32.0;
    humidity:
      id: 'humidity_cold'
      name: "Humidity (Cold)"
      accuracy_decimals: 1
    address: "0x38"
    update_interval: 5s

