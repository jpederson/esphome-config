esphome:
  name: snowball-sensors
  friendly_name: "Snowball Sensors"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: snowball-sensors-ap
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  password: "7232c1fbcf3b089621aed0a42dde03c9"

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

web_server:
  port: 80

uart:
  id: uart_a
  rx_pin: 20  #For ESP32, you can use any pin, Recommend Use UART_2, Don't use UART_0, It might Cause Boot Fail or System Hang
  tx_pin: 21  #For ESP32, you can use any pin, Recommend Use UART_2, Don't use UART_0, It might Cause Boot Fail or System Hang
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE
  
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 100kHz
  sda_pullup_enabled: true
  scl_pullup_enabled: true
  
sensor:
  - platform: aht10
    variant: AHT10
    temperature:
      id: 'temperature_cold'
      name: "Temperature (Cold)"
      unit_of_measurement: "°F"
      accuracy_decimals: 1
#      filters:
#        - lambda: return x * (9.0 / 5.0) + 32.0;
    humidity:
      id: 'humidity_cold'
      name: "Humidity (Cold)"
      accuracy_decimals: 1
    address: 0x38
    update_interval: 10s

