esphome:
  name: c3-mini-aht10

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: test-sensors
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key
    
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  sda_pullup_enabled: true
  scl_pullup_enabled: true
  
sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      id: 'temperature_a'
      name: "Temperature"
      filters:
        - lambda: return x * (9.0 / 5.0) + 32.0;
    humidity:
      id: 'humidity_a'
      name: "Humidity"
    update_interval: 10s
