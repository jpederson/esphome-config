esphome:
  name: c3-mini-aht10

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: test-sensors
    password: !secret fallback-ap-password
logger:

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: aht10
    temperature:
      name: "Room Temperature"
    humidity:
      name: "Room Humidity"
    update_interval: 60s


