esphome:
  name: dust-collector-toggle-planer
  friendly_name: Dust Collector Toggle (Planer)

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "zztsETbpsAJ6DXoK3jWP8zDoMqqLl3tM1s1IrDGue8c="
  actions:
    - action: start_effect
      variables:
        my_effect: string
      then:
        - light.turn_on:
            id: bed_notify
            effect: !lambda 'return my_effect.c_str();'

ota:
  platform: esphome
  password: "2d4a1373625ac1390151c72295a460d1"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "dust-toggle-planer-ap"
    password: "TgHNs1ved4DK"

captive_portal:
    
light:
  - platform: esp32_rmt_led_strip
    id: bed_notify    
    channel_colors: GRB
    pin: GPIO2
    num_leds: 7
    chipset: ws2812
    name: "Light"
    restore_mode: ALWAYS_ON
    on_turn_on:
      then:
        - light.turn_on:
            id: bed_notify
            brightness: 50%
            red: 0.6
            green: 0.0
            blue: 1.0
            effect: Twinkle
    effects:
      - addressable_twinkle:
          name: Twinkle
          twinkle_probability: 10%
          progress_interval: 4ms
      - automation:
          name: Print Done
          sequence:
          - light.turn_on:
              id: bed_notify
              brightness: 100%
              red: 0
              green: 1
              blue: 0
              transition_length: 400ms
          - delay: 500ms
          - light.turn_on:
              id: bed_notify
              brightness: 20%
              red: 0
              green: 1
              blue: 0
              transition_length: 800ms
          - delay: 2s
      - automation:
          name: Print Error
          sequence:
          - light.turn_on:
              id: bed_notify
              brightness: 100%
              red: 1
              green: 0
              blue: 0
              transition_length: 400ms
          - delay: 500ms
          - light.turn_on:
              id: bed_notify
              brightness: 20%
              red: 1
              green: 0
              blue: 0
              transition_length: 800ms
          - delay: 2s

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
    filters:
      - invert: