# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml

esphome:
  name: snowball-sensors
  friendly_name: Snowball Sensors
  
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "Jc0u6ujKkrBNCYYDN+Xr2omv6lCZXXg/fes4XrLDJZw="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  fast_connect: on
  ap:
    ssid: Snowball Sensor Fallback Hotspot
    password: "CeQUJJYPRxol"

captive_portal:
  
sensor:
  - platform: dht
    pin: GPIO4
    model: DHT11
    temperature:
      name: Temperature
      icon: "mdi:thermometer"
      force_update: true
      filters:
        - offset: 50
    humidity:
      name: Humidity
      icon: "mdi:air-humidifier"
      force_update: true
      internal: false
    update_interval: 10s