esphome:
  name: esp32-supermini-ld2420
  friendly_name: esp32-supermini-ld2420

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: esp32-supermini-ld2410-ap
    password: !secret fallback-ap-password
    
logger:
  baud_rate: 0 # Recommended to disable or set to 0 if memory optimization is needed

api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

web_server:
  port: 80

captive_portal:
  
binary_sensor:
  - platform: gpio
    name: "LD2420 OT1 Signal"
    pin: 
      number: GPIO18 # Change to the actual ESP pin connected to OT1
      mode: INPUT_PULLDOWN
    device_class: motion

  - platform: gpio
    name: "LD2420 OT2 Signal"
    pin: 
      number: GPIO19 # Change to the actual ESP pin connected to OT2
      mode: INPUT_PULLDOWN
    device_class: motion