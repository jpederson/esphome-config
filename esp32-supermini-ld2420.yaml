esphome:
  name: esp32-supermini-ld2420
  friendly_name: esp32-supermini-ld2420

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: esp32-supermini-ld2420-ap
    password: !secret fallback-ap-password
    
logger:
  baud_rate: 0 # Recommended to disable or set to 0 if memory optimization is needed

api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

web_server:
  port: 80

captive_portal:

uart:
  id: uart_bus
  rx_pin: GPIO21
  tx_pin: GPIO20
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2420:
  uart_id: uart_bus

sensor:
  - platform: ld2420
    moving_distance:
      name: "Moving Distance"

# True/False (On/Off) states go here
binary_sensor:
  - platform: ld2420
    has_target:
      name: "Presence Target"

# String/Text information goes here
text_sensor:
  - platform: ld2420
    fw_version:
      name: "Firmware Version"