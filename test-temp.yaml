esphome:
  name: esp32-super-mini-temp

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: test-temp-ap
    password: !secret fallback-ap-password
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

web_server:
  port: 80

# 1-Wire bus setup
one_wire:
  - platform: gpio
    pin: GPIO8

# Sensor configuration
sensor:
  - platform: dallas_temp
    index: 0
    name: "Temperature"
    update_interval: 5s
    icon: "mdi:thermometer"
    unit_of_measurement: °C
    device_class: temperature