esphome:
  name: esp32-super-mini-temp

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Configure Wi-Fi for your local network
wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

# Enable Home Assistant API and Web Server
api:
logger:
ota:
  - platform: esphome

web_server:
  port: 80

# 1-Wire bus setup
one_wire:
  - platform: gpio
    pin: GPIO8

# Sensor configuration
sensor:
  - platform: dallas_temp
    index: 0
    name: "Super Mini Temperature"
    update_interval: 60s