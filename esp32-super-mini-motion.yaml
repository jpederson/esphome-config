esphome:
  name: esp32-super-mini-motion
  friendly_name: esp32-super-mini-motion

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB
  fast_connect: true
  ap:
    ssid: esp32-super-mini-motion-ap
    password: !secret fallback-ap-password
    
logger:
  baud_rate: 0 # Recommended to disable or set to 0 if memory optimization is needed

api:
  encryption:
    key: !secret ha-api-key

ota:
  platform: esphome
  encryption:

web_server:
  port: 80

captive_portal:

uart:
  rx_pin: GPIO21
  tx_pin: GPIO20
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  # Optional: configure gateway or timeout settings

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence Detected"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Target Distance"
    still_distance:
      name: "Still Target Distance"
    moving_energy:
      name: "Moving Target Energy"
    still_energy:
      name: "Still Target Energy"