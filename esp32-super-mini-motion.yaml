esphome:
  name: esp32-super-mini-motion
  friendly_name: esp32-super-mini-motion

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

    
logger:
  baud_rate: 0 # Recommended to disable or set to 0 if memory optimization is needed

api:
  encryption:
    key: "+ngQeKgH7qybldMTkPvdOB8MSPWrQO8pQkVS3S1u4iY="

ota:
  - platform: esphome

captive_portal:

uart:
  rx_pin: GPIO21
  tx_pin: GPIO20
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  # Optional: configure gateway or timeout settings

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence Detected"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2410
    moving_target_distance:
      name: "Moving Target Distance"
    still_target_distance:
      name: "Still Target Distance"
    moving_target_energy:
      name: "Moving Target Energy"
    still_target_energy:
      name: "Still Target Energy"