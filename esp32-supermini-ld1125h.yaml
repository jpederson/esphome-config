
substitutions:
  devicename: "esp32-supermini-ld1125h"
  friendly_name: "esp32-supermini-ld1125h"
  update_time: 10s #update time for for general temp sensors etc

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -200
    then:
      - uart.write:
          id: uart_a
          data: !lambda |-
            std::string th1st = "mth1=" + str_sprintf("%.0f",id(LD1125H_mth1).state) +"\r\n";
            return std::vector<uint8_t>(th1st.begin(), th1st.end());
      - uart.write:
          id: uart_a
          data: !lambda |-
            std::string th2st = "mth2=" + str_sprintf("%.0f",id(LD1125H_mth2).state) +"\r\n";
            return std::vector<uint8_t>(th2st.begin(), th2st.end());
      - uart.write:
          id: uart_a
          data: !lambda |-
            std::string th3st = "mth3=" + str_sprintf("%.0f",id(LD1125H_mth3).state) +"\r\n";
            return std::vector<uint8_t>(th3st.begin(), th3st.end());
      - uart.write:
          id: uart_a
          data: !lambda |-
            std::string rmaxst = "rmax=" + str_sprintf("%.1f",id(LD1125H_rmax).state) +"\r\n";
            return std::vector<uint8_t>(rmaxst.begin(), rmaxst.end());
            
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

packages:
  sensor_suite: !include common/hlk-ld1125h.yaml
  
# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "ataWVK5N8c4PnCPnSxEMXNsV0cYOWNSaAH0zyPqUWFE="

ota:
  platform: esphome
  encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "esp32-supermini-ld1125h-ap"
    password: "BzupHAdIQZy8"
  
esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

web_server:
  port: 80

uart:
  id: uart_a
  rx_pin: 20  #For ESP32, you can use any pin, Recommend Use UART_2, Don't use UART_0, It might Cause Boot Fail or System Hang
  tx_pin: 21  #For ESP32, you can use any pin, Recommend Use UART_2, Don't use UART_0, It might Cause Boot Fail or System Hang
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE
  
i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a

sensor:
  - platform: bme680
    temperature:
      id: temperature
      name: Temperature
      unit_of_measurement: °C
      accuracy_decimals: 1
      icon: "mdi:thermometer"
    pressure:
      name: "Pressure"
    humidity:
      id: "humidity"
      name: "Humidity"
    gas_resistance:
      id: "gas_resistance"
      name: "Gas Resistance"
    address: 0x77
    update_interval: 15s
  - platform: template
    name: "Indoor Air Quality"
    id: iaq
    icon: "mdi:gauge"
    update_interval: 30s
    lambda: |-
      return log(id(gas_resistance).state) + 0.04 *  id(humidity).state;
      
text_sensor:
  - platform: template
    name: "IAQ Classification"
    icon: "mdi:checkbox-marked-circle-outline"
    update_interval: 30s
    lambda: |-
      if (int(id(iaq).state) <= 50) {
        return {"Excellent"};
      }
      else if (int(id(iaq).state) <= 100) {
        return {"Good"};
      }
      else if (int(id(iaq).state) <= 150) {
        return {"Lightly polluted"};
      }
      else if (int(id(iaq).state) <= 200) {
        return {"Moderately polluted"};
      }
      else if (int(id(iaq).state) <= 250) {
        return {"Heavily polluted"};
      }
      else if (int(id(iaq).state) <= 350) {
        return {"Severely polluted"};
      }
      else if (int(id(iaq).state) <= 500) {
        return {"Extremely polluted"};
      }
      else {
        return {"unknown"};
      }


