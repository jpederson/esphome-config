
substitutions:
  devicename: "esp32-supermini-ld1125h"
  friendly_name: "esp32-supermini-ld1125h"
  update_time: 10s #update time for for general temp sensors etc

packages:
  core: !include common/supermini/core.yaml
  uart: !include common/supermini/uart.yaml
  motion: !include common/sensors/ld1125h.yaml
  
  
i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a

sensor:
  - platform: bme680
    temperature:
      id: temperature
      name: Temperature
      unit_of_measurement: °C
      accuracy_decimals: 1
      icon: "mdi:thermometer"
    pressure:
      name: "Pressure"
    humidity:
      id: "humidity"
      name: "Humidity"
    gas_resistance:
      id: "gas_resistance"
      name: "Gas Resistance"
    address: 0x77
    update_interval: 15s
  - platform: template
    name: "Indoor Air Quality"
    id: iaq
    icon: "mdi:gauge"
    update_interval: 30s
    lambda: |-
      return log(id(gas_resistance).state) + 0.04 *  id(humidity).state;
      
text_sensor:
  - platform: template
    name: "IAQ Classification"
    icon: "mdi:checkbox-marked-circle-outline"
    update_interval: 30s
    lambda: |-
      if (int(id(iaq).state) <= 50) {
        return {"Excellent"};
      }
      else if (int(id(iaq).state) <= 100) {
        return {"Good"};
      }
      else if (int(id(iaq).state) <= 150) {
        return {"Lightly polluted"};
      }
      else if (int(id(iaq).state) <= 200) {
        return {"Moderately polluted"};
      }
      else if (int(id(iaq).state) <= 250) {
        return {"Heavily polluted"};
      }
      else if (int(id(iaq).state) <= 350) {
        return {"Severely polluted"};
      }
      else if (int(id(iaq).state) <= 500) {
        return {"Extremely polluted"};
      }
      else {
        return {"unknown"};
      }


